<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE EGYPTIAN KING — Shopping Bag</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

   <style>
  :root {
    --bg: #050508;
    --card-bg: rgba(18, 18, 24, 0.75);
    --border-glow: rgba(255, 255, 255, 0.15);
    --text-main: #ffffff;
    --text-muted: #a0a0b0;
    --accent-primary: #ffffff;
    --accent-glow: rgba(255, 255, 255, 0.4);
  }

  body[data-theme="neon"] {
    --bg: #090014;
    --card-bg: rgba(24, 9, 43, 0.8);
    --border-glow: rgba(236, 72, 153, 0.4);
    --accent-primary: #ec4899;
    --accent-glow: rgba(236, 72, 153, 0.6);
  }

  body[data-theme="ai"] {
    --bg: #030712;
    --card-bg: rgba(15, 23, 42, 0.8);
    --border-glow: rgba(56, 189, 248, 0.35);
    --accent-primary: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.5);
  }

  body[data-theme="royalty"] {
    --bg: #0a0802;
    --card-bg: rgba(28, 23, 13, 0.85);
    --border-glow: rgba(234, 179, 8, 0.35);
    --accent-primary: #eab308;
    --accent-glow: rgba(234, 179, 8, 0.5);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  body {
    background-color: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: rgba(5, 5, 8, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-glow);
    padding: 1.25rem 4rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ... (rest of your styles) ... */

  /* Responsive styles */
  @media (max-width: 768px) {
    body {
      overflow-x: hidden;
    }
    header {
      flex-direction: column;
      align-items: flex-start;
      padding: 1rem;
    }
    .cart-item {
      flex-direction: column;
      text-align: center;
    }
    .cart-item-left {
      flex-direction: column;
    }
    .cart-actions {
      flex-direction: column;
      width: 100%;
    }
    .btn-buy-now {
      width: 100%;
    }
  }

  @media (max-width: 1024px) {
    .container {
      max-width: 95%;
    }
  }

  @media (min-width: 1600px) {
    .container {
      max-width: 1400px;
    }
  }
</style>
</head>
<body>
    <header>
        <a href="index.html" class="brand-logo">The Egyptian King</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop Collection</a></li>
                <li><a href="terms.html">Terms & Policies</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">Your Shopping Bag</h1>
        <div id="cart-container" class="cart-list">
            <!-- ITEMS LOADED VIA JS -->
        </div>
    </main>

    <footer>
        <div class="brand-logo">THE EGYPTIAN KING</div>
        <div class="copyright">&copy; 2026 THE EGYPTIAN KING. All rights reserved.</div>
    </footer>

    <script>
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            const container = document.getElementById('cart-container');

            if (!cart || cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>YOUR BAG IS EMPTY</h2>
                        <p style="margin-bottom: 2rem;">Explore our collection to add exclusive apparel.</p>
                        <a href="shop.html" class="btn-buy-now" style="display: inline-block;">GO TO SHOP</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = cart.map((item, index) => {
                const itemPrice = Number(item.price) || 0;
                const itemQty = Number(item.qty) || 1;
                const totalPrice = (itemPrice * itemQty).toFixed(2);
                const itemImg = item.img ? `<img src="${item.img}" alt="${item.name}" class="cart-img">` : `<div class="cart-img" style="display:flex;align-items:center;justify-content:center;font-size:2rem;">𓀀</div>`;

                return `
                    <div class="cart-item">
                        <div class="cart-item-left">
                            ${itemImg}
                            <div class="cart-info">
                                <h3>${item.name || 'Custom Garment'}</h3>
                                <p>E£${totalPrice}</p>
                            </div>
                        </div>
                        
                        <div class="cart-actions">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                <span>${itemQty}</span>
                                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            </div>
                            <button class="btn-remove" onclick="removeItem(${index})" title="Remove Item">✕</button>
                            <button class="btn-buy-now" onclick="proceedToCheckout(${item.id})">BUY NOW</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeQty(index, delta) {
            let cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            if (!cart[index]) return;

            cart[index].qty = (cart[index].qty || 1) + delta;

            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }

            localStorage.setItem('kingCart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('kingCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('kingCart', JSON.stringify(cart));
            renderCart();
        }

        function proceedToCheckout(productId) {
            window.location.href = `checkout.html?buyId=${productId}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderCart();
            const savedTheme = localStorage.getItem('selectedTheme') || 'neon';
            if (savedTheme !== 'basic') {
                document.body.setAttribute('data-theme', savedTheme);
            }
        });
    </script>
</body>
</html>
