<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews — THE EGYPTIAN KING</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --card-bg: rgba(18, 18, 24, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --accent: #ffffff;
            --text-muted: #a0a0b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; }

        header {
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 1.2rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-decoration: none; }
        nav ul { display: flex; list-style: none; gap: 2rem; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
        nav a.active { color: #fff; }

        .layout-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            display: grid;
            gap: 2.5rem;
        }

        .form-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            height: fit-content;
        }

        .form-box h2 { font-family: 'Cinzel', serif; margin-bottom: 1.5rem; font-size: 1.5rem; }

        .input-field {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: #fff;
            margin-bottom: 1rem;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            padding: 0.9rem;
            border-radius: 30px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }

        .reviews-feed {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .review-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .review-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .reviewer-name { font-weight: 700; font-size: 1rem; }
        .review-stars { color: #eab308; }
        .review-text { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

        /* DEVICE SPECIFIC STYLES */

        /* 📱 PHONE (Stacked Single Column) */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            .layout-container { grid-template-columns: 1fr; }
        }

        /* 💻 DESKTOP & TABLET (Side-by-Side Split View) */
        @media (min-width: 769px) {
            .layout-container { grid-template-columns: 1fr 2fr; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">The Egyptian King</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="reviews.html" class="active">Reviews</a></li>
            </ul>
        </nav>
    </header>

    <div class="layout-container">
        <!-- FORM COLUMN -->
        <div class="form-box">
            <h2>LEAVE A REVIEW</h2>
            <form id="reviewForm">
                <input type="text" id="author" class="input-field" placeholder="Your Name" required>
                <select id="rating" class="input-field" required>
                    <option value="5">★★★★★ (5/5)</option>
                    <option value="4">★★★★☆ (4/5)</option>
                    <option value="3">★★★☆☆ (3/5)</option>
                </select>
                <textarea id="comment" class="input-field" rows="4" placeholder="Share your experience with quality & fit..." required></textarea>
                <button type="submit" class="btn-submit">Submit Review</button>
            </form>
        </div>

        <!-- REVIEWS FEED COLUMN -->
        <div class="reviews-feed">
            <div class="review-card">
                <div class="review-header">
                    <span class="reviewer-name">Omar K.</span>
                    <span class="review-stars">★★★★★</span>
                </div>
                <p class="review-text">The 500 GSM weight on the Pharaoh zip-up is insane. Best quality hoodie made in Egypt right now.</p>
            </div>

            <div class="review-card">
                <div class="review-header">
                    <span class="reviewer-name">Youssef M.</span>
                    <span class="review-stars">★★★★★</span>
                </div>
                <p class="review-text">Oversized fit is spot on. Delivered fast and packaging was premium.</p>
            </div>
        </div>
    </div>

    <!-- Firebase App & Firestore Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            projectId: "the-egyptian-king-2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('reviewForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('author').value;
            const rating = document.getElementById('rating').value;
            const comment = document.getElementById('comment').value;

            try {
                await addDoc(collection(db, "reviews"), {
                    name: name,
                    rating: rating,
                    comment: comment,
                    timestamp: new Date()
                });
                alert("Review submitted successfully!");
                form.reset();
            } catch (err) {
                console.error("Error adding review: ", err);
            }
        });
    </script>
</body>
</html>
